name: CI

# Build check for pushes and pull requests. No secrets: signed releases are made locally with ./release.sh.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26 # Liquid Glass API needs the macOS 26 SDK
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./build.sh
